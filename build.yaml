# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
# include:
#   #- board: nice_nano_v2
#     #shield: corne_left nice_view_adapter nice_view_gem
#     #snippet: studio-rpc-usb-uart
#     #cmake-args: -DCONFIG_ZMK_STUDIO=y
#   #- board: nice_nano_v2
#     #shield: corne_right nice_view_adapter nice_view_gem
#   - board: nice_nano_v2
#     #shield: lily58_left nice_view_adapter nice_view_gem
#     shield: lily58_left nice_view_adapter nice_view
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#   - board: nice_nano_v2
#     shield: lily58_right nice_view_adapter nice_view_gem
#     cmake-args: -DCONFIG_ZMK_STUDIO=y

#   - board: nice_nano_v2
#     shield: settings_reset

    
include:
  # USB dongle: central controller
  - board: halcyon_dongle//zmk
    shield: lily58_dongle

  # Lily58 left half: peripheral
  - board: nice_nano//zmk
    shield: lily58_left(1)
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Lily58 right half: peripheral
  - board: nice_nano//zmk
    shield: lily58_right(1)
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Reset firmware for both nice!nano v2 controllers
  - board: nice_nano//zmk
    shield: settings_reset

  # Reset firmware for the Halcyon Dongle
  - board: halcyon_dongle//zmk
    shield: settings_reset

